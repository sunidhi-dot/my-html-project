<!DOCTYPE html>
<html>
<head>
    <title>Seminar Schedule</title>

    <style>
        table {
            width: 820px;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: "Times New Roman", serif;
            font-size: 20px;
        }

        th, td {
            border: 2px solid black;
            text-align: center;
            vertical-align: middle;
            padding: 10px;
        }

        th {
            font-weight: bold;
        }

        .day {
            width: 160px;
        }

        .begin {
            width: 140px;
        }

        .end {
            width: 140px;
        }

        .topic {
            width: 380px;
        }
    </style>
</head>

<body>

<table>

    <!-- HEADER -->
    <tr>
        <th rowspan="3" class="day">Day</th>

        <!-- Seminar is above Schedule AND Topic -->
        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <!-- Schedule is above Begin and End -->
        <th colspan="2">Schedule</th>

        <!-- Topic is beside Schedule and covers remaining header rows -->
        <th rowspan="2" class="topic">Topic</th>
    </tr>

    <tr>
        <th class="begin">Begin</th>
        <th class="end">End</th>
    </tr>


    <!-- MONDAY -->
    <tr>
        <td rowspan="2">Monday</td>

        <td rowspan="2">8:00 a.m.</td>
        <td rowspan="2">5:00 p.m.</td>

        <td>Introduction to XML</td>
    </tr>

    <tr>
        <td>Validity: DTD and Relax NG</td>
    </tr>


    <!-- TUESDAY -->
<tr>
    <td rowspan="3">Tuesday</td>
    <td>8:00 a.m.</td>
    <td>11:00 a.m.</td>
    <td>XPath</td>
</tr>

<tr>
    <td>11:00 a.m.</td>
    <td>2:00 p.m.</td>
    <td rowspan="2">XSL Transformations</td>
</tr>

<tr>
    <td>2:00 p.m.</td>
    <td>5:00 p.m.</td>
</tr>


    <!-- WEDNESDAY -->
    <tr>
        <td>Wednesday</td>

        <td>8:00 a.m.</td>
        <td>12:00 p.m.</td>

        <td>XSL Formatting Objects</td>
    </tr>

</table>

</body>
</html>
