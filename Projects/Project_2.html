<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Media Page</title>
</head>
<body>
    <h1>My Favorite Media</h1>
    <!-- favorite image -->
     <h2>Image</h2>
     <img src="image.jpg" alt="nature image" width="200">
     
     <!-- favorite audio -->
     <h2>Audio</h2>
     <audio controls>
       <source src="./audio.mp3" type="audio/mpeg">
     </audio>

     <!-- favorite video -->
      <h2>Video</h2>
        <video width="400" controls muted>
            <source src="./video.mp4" type="video/mp4">
        </video>

     <!-- favorite youtube video -->
      <h2>Youtube video</h2>
       <iframe width="500" height="315" src="https://www.youtube.com/embed/CetKwpx3t6g?si=N0_QuVpsrS-OUiPO" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

       <h2>HTML Entities</h2>
       <p>&copy; 2026 My Favorite Media.</p> 
       <p>HTML &amp; CSS</p>
       <p>&lt;h1&gt; is a Heading Tag.</p>
       <P>10 &gt; 5</P>
       <p>Hello &nbsp; world!</p>

       <footer>
        <P>&copy; Sunidhi Chauhan. All rights reserved.</P>
       </footer>
</body>       
</html>
