<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><Table></Table></title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #b9b9b9;
        }
    </style>
</head>
<body>
    <Table>
      <colgroup>
            <col span="2" style="background-color: aquamarine;" />
      </colgroup>
        <tr>
            <th>Country</th>
            <th>Country CODE</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>India</td>
            <td>IN</td>
            <td>india@google.com</td>
        </tr>
        <tr>
            <td>United State of America </td>
            <td>USA</td>
            <td>usa@google.com</td>
        </tr>
        <tr>
            <td>Japan</td>
            <td>JP</td>
            <td>jp@google.com</td>
        </tr>
        <tr>
            <td>Nepal</td>
            <td>NP</td>
            <td>np@google.com</td>
        </tr>
    </Table>
    <Table  style="width: 10%">
        <tr>
            <th colspan="2">Country</th>
            <td>India</td>
            <td>Nepal</td>
        </tr>
        <tr>
            <th>CODE</th>
            <td>IN</td>
            <td>NP</td>
        </tr>
    </Table>
</body>
</html>
