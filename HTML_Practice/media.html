<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <video width="320" height="240" controls muted autoplay>
       <source src="sample.mp4" type="video/mp4">
      </video>

      <audio controls>
       <source src="sample-12s.mp3" type="audio/mpeg">
    </audio>

    <image controls>
    <source src="sample-clouds.jpg" type="image/jpg">
    </image> 
    <picture>
    <source media="(min-width: 800px)" srcset="sample-clouds.jpg">
    <img src="sample-clouds.jpg" alt="Clouds" width="400">
    </picture>

     <canvas id="canvas"></canvas>
</body>
</html>
