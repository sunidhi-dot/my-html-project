<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms one</title>
    <style>
         body {
       background-color: #1baa99;
       color: #fff
       }
    </style>
</head>
<body>
      <h1>Forms in HTML</h1>
      <form action="url" method="get" accept-charset="utf-8" autocomplete="off" enctype="">
        
        <label for="fname">First Name</label> <br/>
      <input type="text" placeholder="first name" name="" value="sunidhi" id="fname"> <br/>

      <input type="week" name="" id=""> 
      <input type="password" name="" id=""> 
      <input type="reset" value="reset"> <br/>
      <input type="email" placeholder="abc@gmail.com"> <br/>
      <input type="radio" name="gender"> Male
      <input type="radio" name="gender"> Female
      <input type="range" min="0" max="100">

      <select name="editors" id="">
        <option value="vscode">vscode</option>
        <option value="sublime">sublime</option>
      </select>

      <input list="editors" name="editor">
      <datalist id="editors"> 
        <option value="vscode">vscode</option>
        <option value="sublime">sublime</option>
      </datalist>

      <input type="hidden" name="">
     
      <button type="submit">submit</button>
      </form>
</body>
</html>
